<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Writing Assistant Bridge</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      width: 330px;
      margin: 0;
      padding: 14px;
      background: #111820;
      color: #edf2f7;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 16px;
      line-height: 1.25;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #18212d;
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #94a3b8;
      flex: 0 0 auto;
    }

    .ok .dot { background: #22c55e; }
    .warn .dot { background: #f97316; }

    dl {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 6px 8px;
      margin: 12px 0 0;
      font-size: 12px;
      color: #cbd5e1;
    }

    dt {
      color: #94a3b8;
    }

    dd {
      margin: 0;
      word-break: break-all;
    }

    .preview {
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f1720;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 120px;
      overflow: auto;
      font-size: 12px;
      color: #dbeafe;
    }
  </style>
</head>
<body>
  <h1>Writing Assistant Bridge</h1>
  <div id="status" class="status">
    <span class="dot"></span>
    <span id="statusText">확인 중...</span>
  </div>
  <dl>
    <dt>로컬 연결</dt>
    <dd id="bridge">-</dd>
    <dt>현재 탭</dt>
    <dd id="tab">-</dd>
    <dt>탭 캡처</dt>
    <dd id="content">-</dd>
    <dt>캡처 횟수</dt>
    <dd id="captures">-</dd>
    <dt>대기 명령</dt>
    <dd id="pending">-</dd>
  </dl>
  <div id="preview" class="preview">-</div>
  <script src="popup.js"></script>
</body>
</html>
